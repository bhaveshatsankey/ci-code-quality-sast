# .github/workflows/ci.yml
name: CI Checks

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

# Global permissions for security features
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ------------------------------------------------------------
  # Ruff - Code Quality (Linting & Formatting)
  # ------------------------------------------------------------
  ruff:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ------------------------------------------------------------
  # CodeQL - SAST Security Analysis
  # ------------------------------------------------------------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ------------------------------------------------------------
  # Bandit - Python Security Linter
  # ------------------------------------------------------------
  bandit:
    name: Bandit Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: bandit -r . -ll -f screen
        continue-on-error: true

  # ------------------------------------------------------------
  # Safety - Dependency Vulnerability Scanner
  # ------------------------------------------------------------
  safety:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for requirements.txt
        id: check-requirements
        run: |
          if [ -f requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check-requirements.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        if: steps.check-requirements.outputs.exists == 'true'
        run: pip install safety

      - name: Check Dependencies
        if: steps.check-requirements.outputs.exists == 'true'
        run: safety check -r requirements.txt --output screen
        continue-on-error: true

  # ------------------------------------------------------------
  # Django Tests with PostgreSQL
  # ------------------------------------------------------------
  tests:
    name: Django Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for requirements.txt
        id: check-requirements
        run: |
          if [ -f requirements.txt ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No requirements.txt found - skipping tests"
          fi

      - name: Setup Python
        if: steps.check-requirements.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        if: steps.check-requirements.outputs.exists == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations
        if: steps.check-requirements.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py migrate --no-input

      - name: Run Tests
        if: steps.check-requirements.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DJANGO_SETTINGS_MODULE: config.settings
        run: python manage.py test --no-input --verbosity=2

      - name: Generate Coverage Report
        if: steps.check-requirements.outputs.exists == 'true'
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DJANGO_SETTINGS_MODULE: config.settings
        run: |
          pip install coverage
          coverage run --source='.' manage.py test
          coverage report
          coverage xml

      - name: Upload Coverage to Codecov
        if: steps.check-requirements.outputs.exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
# .github/workflows/ci.yml
name: CI Checks

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

# Global permissions for security features
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ------------------------------------------------------------
  # Ruff - Code Quality (Linting & Formatting)
  # ------------------------------------------------------------
  ruff:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ------------------------------------------------------------
  # CodeQL - SAST Security Analysis
  # ------------------------------------------------------------
  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ------------------------------------------------------------
  # Bandit - Python Security Linter
  # ------------------------------------------------------------
  bandit:
    name: Bandit Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: bandit -r . -ll -f screen
        continue-on-error: true

  # ------------------------------------------------------------
  # pip-audit - Dependency Vulnerability Scanner
  # ------------------------------------------------------------
  pip-audit:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit Dependencies
        run: pip-audit --requirement requirements.txt --desc
        continue-on-error: true

  # ------------------------------------------------------------
  # Django Tests with SQLite
  # ------------------------------------------------------------
  tests:
    name: Django Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Migrations
        env:
          DJANGO_SETTINGS_MODULE: core.settings
        run: python manage.py migrate --no-input

      - name: Run Tests
        env:
          DJANGO_SETTINGS_MODULE: core.settings
        run: python manage.py test --no-input --verbosity=2

      - name: Generate Coverage Report
        env:
          DJANGO_SETTINGS_MODULE: core.settings
        run: |
          pip install coverage
          coverage run --source='.' manage.py test
          coverage report
          coverage xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        continue-on-error: true
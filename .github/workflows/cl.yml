# .github/workflows/ci.yml
name: CI Checks

on:
  pull_request:
    branches:
      - development
      - staging
      - main
  push:
    branches:
      - development
      - staging
      - main

# Global permissions for the entire workflow
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ------------------------------------------------------------
  # Ruff - Code Quality (CHECK ONLY, DON'T FIX)
  # ------------------------------------------------------------
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff Lint Check
        run: ruff check . --output-format=github

      - name: Ruff Format Check
        run: ruff format --check .

  # ------------------------------------------------------------
  # CodeQL - SAST Security Analysis
  # ------------------------------------------------------------
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          upload: true

  # ------------------------------------------------------------
  # Bandit - Python Security Linter (Backup for CodeQL)
  # ------------------------------------------------------------
  bandit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit Security Scan
        run: bandit -r . -ll -f screen
        continue-on-error: true

  # ------------------------------------------------------------
  # Safety - Dependency Vulnerability Scanner
  # ------------------------------------------------------------
  safety:
    runs-on: ubuntu-latest
    if: hashFiles('requirements.txt') != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Safety
        run: pip install safety

      - name: Check Dependencies
        run: safety check -r requirements.txt --output screen
        continue-on-error: true

  # ------------------------------------------------------------
  # Tests (if you have Django tests)
  # ------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest
    if: hashFiles('requirements.txt') != ''
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: python manage.py migrate --no-input

      - name: Run Django Tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: python manage.py test --no-input

      - name: Generate Coverage Report
        run: |
          pip install coverage
          coverage run --source='.' manage.py test
          coverage report
          coverage xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true